<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DHav3ns</title>
    <style>
        body {
            background: linear-gradient(135deg, #FF007F, #7928CA, #4BB4DE);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #FFD700;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { font-size: 0.95rem; color: #f0f0f0; margin-bottom: 25px; }
        .btn {
            display: block;
            background: #ffffff;
            color: #1a1a1a;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            background: #FFD700;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="your-logo.jpg" alt="Logo" class="logo">
        <h1>YourBrand 3D 🇱🇻</h1>
        <p>Bringing imagination to life in Riga, layer by layer. 🪄</p>
        
        <a href="https://etsy.com/shop/yourshop" class="btn" target="_blank">🛒 Shop Etsy (Global Shipping)</a>
        <a href="#markets" class="btn">📍 Catch Us at Riga Markets This Week</a>
        <a href="https://instagram.com/3dhav3ns" class="btn" target="_blank">🎬 Watch Our Satisfying Reels</a>
        <a href="mailto:3dhav3ns@gmail.com" class="btn">💬 Custom Print Inquiry</a>
        
        <div class="footer">
            <p>Latvian Quality • Fast Omniva/DPD Shipping 📦</p>
        </div>
    </div>
</body>
</html>
