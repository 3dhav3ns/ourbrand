<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourBrand | 3D Printing Riga</title>
    <style>
        body {
            background: linear-gradient(135deg, #FF007F, #7928CA, #4BB4DE);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #FFD700;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { font-size: 0.95rem; color: #f0f0f0; margin-bottom: 25px; }
        .btn {
            display: block;
            background: #ffffff;
            color: #1a1a1a;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            background: #FFD700;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Replace with your actual logo/image link -->
        <img src="your-logo.jpg" alt="Logo" class="logo">
        <h1>YourBrand 3D 🇱🇻</h1>
        <p>Bringing imagination to life in Riga, layer by layer. 🪄</p>
        
        <!-- Link to your catalog page (Notion, Canva, or Google Drive) -->
        <a href="YOUR_CATALOG_LINK_HERE" class="btn" target="_blank">📦 Browse Available Items & Pricing</a>
        
        <!-- Direct Instagram DM Link -->
        <a href="https://instagram.com/direct/t/YOUR_INSTAGRAM_HANDLE" class="btn" target="_blank">💬 Order via Instagram DM</a>
        
        <!-- Direct Email Link with pre-filled subject line -->
        <a href="mailto:your-email@inbox.lv?subject=3D%20Print%20Order%20Inquiry" class="btn">📧 Order via Email</a>
        
        <!-- Local Riga Markets Info -->
        <a href="#markets" class="btn">📍 Catch Us at Riga Markets This Week</a>
        
        <div class="footer">
            <p>Made in Riga • Local Omniva Shipping Available 📦</p>
        </div>
    </div>
</body>
</html>
